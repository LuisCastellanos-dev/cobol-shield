name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unicode-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for invisible Unicode
        run: python3 tools/check-invisibles.py .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        run: python3 -m pytest tests/ -v
